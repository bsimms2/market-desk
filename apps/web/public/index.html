<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets safe-area insets (home indicator) reach the tab bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Add to Home Screen: open full-screen, no Safari toolbar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Market Desk" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        /* Matches theme.tsx bg, so Safari's toolbar tint blends with the app. */
        background: #f4f6f8;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f1216;
        }
      }
      body {
        overflow: hidden;
      }
      /*
       * Pin the app to the visible screen. position: fixed + inset 0 tracks
       * iOS Safari's toolbar and fills the Home Screen app edge to edge (a
       * 100%-tall #root ran under Safari's toolbar; a measured height left a
       * gap in Home Screen mode). Safe-area padding is applied inside the app.
       */
      #root {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      /*
       * iOS bug in Home Screen mode with a translucent status bar: the page is
       * drawn from the top of the screen but window.innerHeight is short by the
       * status bar height, leaving an empty strip under the tab bar. When the
       * gap matches that signature exactly, stretch #root down over it.
       * Anywhere else (Safari, desktop) the check fails and nothing changes.
       */
      (function () {
        var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
        if (!standalone) return;
        var probe;
        function insetTop() {
          if (!probe) {
            probe = document.createElement("div");
            probe.style.cssText = "position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top)";
            document.body.appendChild(probe);
          }
          return parseFloat(getComputedStyle(probe).paddingTop) || 0;
        }
        function fix() {
          var root = document.getElementById("root");
          if (!root) return;
          var landscape = window.innerWidth > window.innerHeight;
          var screenH = landscape ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
          var gap = screenH - window.innerHeight;
          var top = insetTop();
          root.style.bottom = gap > 0 && top > 0 && Math.abs(gap - top) <= 2 ? -gap + "px" : "0";
        }
        window.addEventListener("load", fix);
        window.addEventListener("resize", fix);
        window.addEventListener("orientationchange", function () { setTimeout(fix, 300); });
        document.addEventListener("DOMContentLoaded", fix);
      })();
    </script>
  </body>
</html>

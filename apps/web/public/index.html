<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets safe-area insets (home indicator) reach the tab bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Add to Home Screen: open full-screen, no Safari toolbar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Market Desk" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        /* Matches theme.tsx bg, so Safari's toolbar tint blends with the app. */
        background: #f4f6f8;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f1216;
        }
      }
      body {
        overflow: hidden;
      }
      /*
       * iOS Safari draws its bottom toolbar over the lower part of a 100%-tall
       * page, which hid the tab bar labels. Size the app to the area actually
       * visible: dvh where supported, then the visual viewport height from the
       * script below, which also tracks the toolbar showing and hiding.
       */
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        height: 100dvh;
        height: var(--app-height, 100dvh);
      }
    </style>
    <script>
      (function () {
        var vv = window.visualViewport;
        function fit() {
          var h = vv ? vv.height : window.innerHeight;
          document.documentElement.style.setProperty("--app-height", Math.round(h) + "px");
        }
        fit();
        (vv || window).addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
